[project]
name = "transparent-nn"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch>=2.0",
  "matplotlib>=3.7",
  "pandas>=2.0",
  "numpy>=1.24",
  "pygam>=0.9",
  "jupyter>=1.0",
  "nbconvert>=7.0",
  "ipykernel>=6.0",
]

# The CPU build of PyTorch: the notebook needs no GPU, and the default Linux
# build downloads CUDA libraries in CI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
