name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      # ty checks each notebook against its own environment, which uv builds.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "notebooks/*/uv.lock"
          # keep the PyTorch wheel, so each run doesn't download it again
          prune-cache: false

      - name: Cache hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # prek runs the hook versions pinned in .pre-commit-config.yaml.
      - name: Run checks
        run: uvx prek@0.5.11 run --all-files --show-diff-on-failure
